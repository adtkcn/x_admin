paths:
  /api/admin/apiList:
    get:
      responses: {}
      summary: 获取所有接口
      tags:
      - 公共接口
  /api/admin/common/album/cateAdd:
    post:
      description: 新增相册类目
      parameters:
      - description: token
        in: header
        name: token
        required: true
        type: string
      - description: 父类目ID
        in: body
        name: pid
        schema:
          type: string
      - description: 类目名称
        in: body
        name: name
        required: true
        schema:
          type: string
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/response.Response'
      summary: 类目新增
      tags:
      - common_album-相册管理
  /api/admin/common/album/cateDel:
    post:
      description: 删除相册类目
      parameters:
      - description: token
        in: header
        name: token
        required: true
        type: string
      - description: 类目ID
        in: body
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/response.Response'
      summary: 类目删除
      tags:
      - common_album-相册管理
  /api/admin/common/album/cateList:
    get:
      description: 获取相册类目列表
      parameters:
      - description: token
        in: header
        name: token
        required: true
        type: string
      - description: 类目名称
        in: query
        name: name
        type: string
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/common_schema.CommonCateListResp'
                  type: array
              type: object
      summary: 类目列表
      tags:
      - common_album-相册管理
  /api/admin/common/album/cateRename:
    post:
      description: 相册类目重命名
      parameters:
      - description: token
        in: header
        name: token
        required: true
        type: string
      - description: 类目ID
        in: body
        name: id
        required: true
        schema:
          type: string
      - description: 新类目名称
        in: body
        name: name
        required: true
        schema:
          type: string
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/response.Response'
      summary: 类目重命名
