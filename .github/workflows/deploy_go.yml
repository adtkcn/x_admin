name: Deploy Go Binary to Server

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

env:
  APP_NAME: "x_admin"
  DEPLOY_PATH: "/opt/1panel/apps/openresty/openresty/www/sites/x-admin/"
  PROJECT_DIR: "./server"  # 关键：定义项目子目录

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      - name: Go mod tidy
        run: go mod tidy
        working-directory: ${{ env.PROJECT_DIR }}  # 在 server 目录下执行

      - name: Build Go binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ${{ env.APP_NAME }} .
          echo "构建完成，文件大小: $(du -h ${{ env.APP_NAME }} | cut -f1)"
        working-directory: ${{ env.PROJECT_DIR }}  # 在 server 目录下构建

      - name: Upload binary via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORLD }}
          port: 22
          source: "${{ env.PROJECT_DIR }}/${{ env.APP_NAME }}"
          target: ${{ env.DEPLOY_PATH }}
          overwrite: true

      - name: Restart Docker container via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORLD }}
          port: 22
          script: |
            cd ${{ env.DEPLOY_PATH }}
            chmod +x ${{ env.APP_NAME }}
            docker restart x_admin