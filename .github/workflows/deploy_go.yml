name: Deploy Go Binary to Server

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

env:
  APP_NAME: "x_admin"
  DEPLOY_PATH: "/opt/1panel/apps/openresty/openresty/www/sites/x-admin/"
  PROJECT_DIR: "./server"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
          cache-dependency-path: ${{ env.PROJECT_DIR }}/go.sum

      - name: Verify go.mod is tidy
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "❌ go.mod/go.sum 不干净，请本地执行 'go mod tidy' 并提交" >&2
            git diff -- go.mod go.sum
            exit 1
          fi

      - name: Build Go binary
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ${{ env.APP_NAME }} .
          echo "构建完成，文件大小: $(du -h ${{ env.APP_NAME }} | cut -f1)"

